services:
  - type: web
    name: ecosoporte-digital
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # URL INTERNA de la base PostgreSQL de Render (ecosoporte-db). Se pega en el panel de Render, no aquí.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Correo al crear un ticket (opcional). Valores en el panel de Render, no aquí.
      - key: MAIL_ENABLED
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
