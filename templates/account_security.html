{% extends "base.html" %}{% block title %}Cambiar contraseña | EcoSoporte{% endblock %}{% block content %}<main class="content narrow">
<div class="page-heading"><div><span class="eyebrow">MI CUENTA</span><h1>Cambiar contraseña</h1><p>Usa mínimo 10 caracteres. Si la olvidaste, el administrador puede restablecerla.</p></div></div>
<section class="panel"><form method="post" class="form-inline one-col">
<label>Contraseña actual<input type="password" name="current" required autocomplete="current-password"></label>
<label>Nueva contraseña<input type="password" name="new" minlength="10" required autocomplete="new-password"></label>
<label>Repetir nueva contraseña<input type="password" name="repeat" minlength="10" required autocomplete="new-password"></label>
<div><button class="btn">Guardar contraseña</button></div></form></section></main>{% endblock %}
